services:
  mongo:
    image: mongo:7
    container_name: sareeshop-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: sareeshop-api
    ports:
      - "4001:4001"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/sareeshop
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data:
